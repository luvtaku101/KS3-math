<html lang="en-GB"><head><meta charset="utf-8">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f5f0;--card:#fff;--tx:#1f2a37;--mu:#6b7280;--ac:#0f766e;--ac2:#ccfbf1;--bd:#e5e7eb;--key:#fff7ed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ac:#2dd4bf;--ac2:#134e4a;--bd:#374151;--key:#3a2a1a}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ac:#2dd4bf;--ac2:#134e4a;--bd:#374151;--key:#3a2a1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.1rem;margin:1em 0 .4em}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 13px;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip.x{border-style:dashed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
input[type=text]{flex:1;min-width:180px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:1rem;cursor:pointer}
button.b.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.hd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--tx);padding-bottom:6px;margin-bottom:6px}
.sec{background:var(--ac2);padding:6px 10px;border-radius:8px;font-weight:600;margin:14px 0 6px}
ol.qs{margin:0;padding:0;list-style:none}

sup,sub{font-size:.7em;line-height:0}
#msg{color:#b45309;font-size:.9rem;margin-top:6px}
.wk{font-size:.88rem;color:var(--mu);margin-top:2px;line-height:1.45}
body.pq #key,body.pq .ui{display:none}
body.pk #paper,body.pk .ui{display:none}body.pk #key{display:block}
@media print{:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#555;--bd:#bbb;--ac2:#eee;--key:#fff}.ui{display:none}body{font-size:13px}.q{min-height:90px;break-inside:avoid}#key.show{break-before:page}}
.pdfroot{position:absolute;left:-10000px;top:0;width:794px;padding:40px;background:#fff;color:#000;font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;--tx:#000;--mu:#555;--bd:#bbb;--ac2:#e5e7eb;--card:#fff;--key:#fff}

.pdfroot .q{min-height:92px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script></head><body><div class="w">
<div class="ui">
<h1>📐 KS3 Maths Revision Generator</h1>
<div class="mu">Medium or High level · 30 questions: 15 non-calculator + 15 calculator · High level answer key shows full working</div>
<div class="card"><h2 style="margin-top:0">1. Pick topics</h2>
<div class="chips" id="chips"></div>
<div class="row"><button class="b g" onclick="selAll(1)">Half-term list</button><button class="b g" onclick="selAll(2)">Select all</button><button class="b g" onclick="selAll(0)">Clear</button></div>
<div class="row"><input type="text" id="typed" placeholder="Type a topic, e.g. bearings, ratio, pythagoras" onkeydown="if(event.key==='Enter')addT()"><button class="b g" onclick="addT()">Add</button></div>
<div id="msg"></div></div>
<div class="row"><b>2. Level:</b><button class="chip on" id="lm" onclick="lvl('m')">Medium</button><button class="chip" id="lh" onclick="lvl('h')">High (harder + worked answers)</button></div>

</div>
<div id="out"></div>
</div>
<script>
let seed=1;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+Math.floor(rnd()*(b-a+1)),P=a=>a[R(0,a.length-1)];
const N=v=>{v=+(+v).toFixed(8);return(v<0?'−':'')+Math.abs(v).toLocaleString('en-GB',{maximumFractionDigits:8})};
const p=v=>v<0?`(${N(v)})`:N(v),sup=(b,e)=>`${b}<sup>${e}</sup>`,frac=(n,d)=>`<sup>${n}</sup>⁄<sub>${d}</sub>`;
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b,pd=b=>String(b).padStart(3,'0'),sg=n=>n<0?`− ${-n}`:`+ ${n}`;
const gbp=v=>'£'+(+v).toFixed(2).replace(/\B(?=(\d{3})+\.)/g,',');
const sfs=(v,k)=>{let t=(+v).toPrecision(k);if(/e/.test(t))t=String(Math.round(+t));if(!/\./.test(t))t=t.replace(/\B(?=(\d{3})+$)/g,',');return t.replace('-','−')};
const stm=(m,e)=>`${N(m)} × 10<sup>${e<0?'−'+(-e):e}</sup>`;
const stf=v=>{let[m,e]=(+(+v).toPrecision(10)).toExponential().split('e');return stm(+m,+e)};
const pf=n=>{let o=[],d=2;while(n>1){let c=0;while(n%d==0){n/=d;c++}if(c)o.push(c>1?sup(d,c):d);d++}return o.join(' × ')};
const r1=v=>+(+v).toPrecision(1),PN=['','','','','','pentagon','hexagon','heptagon','octagon','nonagon','decagon','11-sided polygon','dodecagon'];
const mk=(name,kw,n,c,x)=>({name,kw,n,c:c||n,x});
const LOCI=[()=>{let r=R(2,6);return[`Draw the locus of points exactly ${r} cm from a fixed point P.`,`A circle, centre P, radius ${r} cm.`]},
()=>{let d=R(5,9);return[`A and B are ${d} cm apart. Construct the locus of points equidistant from A and B.`,`The perpendicular bisector of AB: a straight line at 90° through the midpoint (${N(d/2)} cm from A), made with equal compass arcs from A and B.`]},
()=>{let a=P([50,60,70,80,100,120]);return[`Two lines meet at X with an angle of ${a}° between them. Construct the locus of points equidistant from both lines.`,`The angle bisector: a straight line from X making ${a/2}° with each line.`]},
()=>{let l=R(4,8),r=R(1,3);return[`AB is ${l} cm long. Draw the locus of points exactly ${r} cm from AB.`,`A “racetrack” shape: two straight lines ${l} cm long, ${r} cm either side of AB, joined by semicircles of radius ${r} cm at A and B (${l+2*r} cm long, ${2*r} cm wide).`]},
()=>{let r=R(2,5),d=R(6,9);return[`A and B are ${d} cm apart and a tree T is somewhere near them. Shade the region that is less than ${r} cm from T and closer to A than to B.`,`Shade inside the circle (centre T, radius ${r} cm) but only the part on A’s side of the perpendicular bisector of AB.`]},
()=>{let r=R(3,8);return[`A dog is tied to a post P by a ${r} m lead on open flat ground. Shade the region it can reach.`,`The inside of a circle, centre P, radius ${r} m.`]}];
const TOP=[
mk('Four operations incl. negatives','negative,integer,add,subtract,multipl,divid,+',[
()=>{let a=R(-12,12),b=R(-12,-1);return[`Work out ${N(a)} − ${p(b)}`,N(a-b)]},
()=>{let a=R(-12,-2),b=R(2,12)*P([1,-1]);return[`Work out ${p(a)} × ${p(b)}`,N(a*b)]},
()=>{let b=P([-9,-8,-7,-6,-4,-3,3,4,6,7,8,9]),c=R(-12,12);return[`Work out ${N(b*c)} ÷ ${p(b)}`,N(c)]},
()=>{let a=R(-9,9),b=R(-9,9),c=R(-9,9);return[`Work out ${N(a)} + ${p(b)} − ${p(c)}`,N(a+b-c)]}],[
()=>{let a=P([-1,1])*R(11,90)/10,b=P([-1,1])*R(11,90)/10;return[`Work out ${p(a)} × ${p(b)}`,N(a*b)]},
()=>{let k=P([-1,1])*R(11,60)/10,y=P([-1,1])*R(3,19)/2;return[`Work out ${N(k*y)} ÷ ${p(y)}`,N(k)]},
()=>{let t=-R(30,95)/10,r=R(80,200)/10,d=R(30,95)/10;return[`At 6 am the temperature was ${N(t)}°C. It rose by ${N(r)}°C by noon, then fell by ${N(d)}°C by midnight. What was the temperature at midnight?`,N(t+r-d)+'°C']}]),
mk('BIDMAS','bidmas,bodmas,order of operations',[
()=>{let a=R(2,9),b=R(2,9),c=R(2,9);return[`Work out ${a} + ${b} × ${c}`,a+b*c]},
()=>{let a=R(2,9),b=R(2,9),c=R(2,12);return[`Work out (${a} + ${b})² − ${c}`,(a+b)**2-c]},
()=>{let d=R(2,6),k=R(2,9),a=R(3,9),b=R(2,9);return[`Work out ${a} × ${b} − ${d*k} ÷ ${d}`,a*b-k]},
()=>{let a=R(2,5),b=R(2,6),c=R(2,5);return[`Work out ${a} + ${sup(b,2)} × ${c}`,a+b*b*c]},
()=>{let s=R(2,6),t=R(2,6),k=R(2,5),e=R(2,9);return[`Work out ${k*(s+t)} ÷ (${s} + ${t}) + ${e}²`,k+e*e]}],[
()=>{let a=R(11,59)/10,b=R(11,59)/10,c=R(11,59)/10;return[`Work out (${N(a)} + ${N(b)}) × ${N(c)}`,N((a+b)*c)]},
()=>{let a=R(21,59)/10,r=R(5,13);return[`Work out ${N(a)}² − √${r*r}`,N(a*a-r)]},
()=>{let a=R(12,95)/10,b=R(12,95)/10,c=R(12,95)/10;return[`Work out ${N(a)} + ${N(b)} ÷ ${N(c)}. Give your answer to 2 d.p.`,(a+b/c).toFixed(2)]}]),
mk('Using a calculator','calculator,estimate,estimation',[
()=>{let x=R(31,98)/10,y=R(11,99)/10;return[`Estimate ${N(x)} × ${N(y)} by rounding each number to 1 significant figure.`,N(r1(x)*r1(y))]},
()=>{let a=R(201,899),b=R(21,99);return[`Estimate ${a} ÷ ${b} by rounding each number to 1 significant figure.`,N(r1(a)/r1(b))]}],[
()=>{let a=R(21,99)/10,b=R(21,99)/10,c=R(21,99)/10;return[`Use a calculator: ${N(a)} × ${N(b)} + ${N(c)}². Give your answer to 3 s.f.`,sfs(a*b+c*c,3)]},
()=>{let x=R(21,99)/10;return[`Use a calculator to find ${N(x)}³ to 2 d.p.`,(x**3).toFixed(2)]},
()=>{let n=R(200,900);return[`Use a calculator to find √${n} to 3 s.f.`,sfs(Math.sqrt(n),3)]},
()=>{let a=R(100,999)/10,b=R(100,999)/10,c=R(21,99)/10;return[`Work out (${N(a)} + ${N(b)}) ÷ ${N(c)} to 3 s.f.`,sfs((a+b)/c,3)]}]),
mk('Significant figures','significant,sig fig,s.f.',[
()=>{let v=R(10001,99999),k=R(1,3);return[`Write ${N(v)} to ${k} significant figure${k>1?'s':''}.`,sfs(v,k)]},
()=>{let v=R(1001,9999)/100000;return[`Write ${v} to 2 significant figures.`,sfs(v,2)]},
()=>{let[t,a]=P([['0.0305',3],['0.00470',3],['2.060',4],['0.8',1],['30.07',4],['0.01002',4],['500.1',4],['0.0090',2]]);return[`How many significant figures are in ${t}?`,a]}],[
()=>{let a=R(41,99)/10,b=R(101,989)/10;return[`Work out ${N(a)} × ${N(b)}. Give your answer to 3 s.f.`,sfs(a*b,3)]},
()=>{let a=R(100,900),b=R(7,19);return[`Work out ${a} ÷ ${b}. Give your answer to 3 s.f.`,sfs(a/b,3)]},
()=>{let r=R(31,99)/10;return[`A circle has radius ${N(r)} cm. Work out its area to 3 s.f.`,sfs(Math.PI*r*r,3)+' cm²']}]),
mk('Rounding','round,decimal place,d.p.',[
()=>{let v=R(11000,99999),u=P([10,100,1000]);return[`Round ${N(v)} to the nearest ${N(u)}.`,N(Math.round(v/u)*u)]},
()=>{let iv=R(10001,99999),k=P([1,2]);return[`Round ${(iv/1000).toFixed(3)} to ${k} decimal place${k>1?'s':''}.`,(Math.round(iv/10**(3-k))/10**k).toFixed(k)]},
()=>{let v=R(1001,19999);return[`A journey is ${N(v)} metres. Write this in km to 1 d.p.`,(Math.round(v/100)/10).toFixed(1)+' km']}],[
()=>{let a=R(100,999),b=P([7,9,11,12,13,14,15,17,19]);return[`Work out ${a} ÷ ${b}. Give your answer to 2 d.p.`,(a/b).toFixed(2)]},
()=>{let n=R(50,500);return[`Work out √${n}. Give your answer to 1 d.p.`,Math.sqrt(n).toFixed(1)]}]),
mk('Standard form','standard form,scientific',[
()=>{let m=R(11,99)/10,e=R(3,7);return[`Write ${N(m*10**e)} in standard form.`,stm(m,e)]},
()=>{let m=R(11,99)/10,e=R(3,6);return[`Write ${stm(m,-e)} as an ordinary number.`,N(m*10**-e)]},
()=>{let a=R(2,5),b=R(2,4),e1=R(2,6),e2=R(2,6);return[`Work out (${a} × 10<sup>${e1}</sup>) × (${b} × 10<sup>${e2}</sup>). Give your answer in standard form.`,stf(a*b*10**(e1+e2))]},
()=>{let b=P([2,3]),a=R(2,3),e1=R(5,9),e2=R(2,4);return[`Work out (${a*b} × 10<sup>${e1}</sup>) ÷ (${b} × 10<sup>${e2}</sup>). Give your answer in standard form.`,stm(a,e1-e2)]}],[
()=>{let m=R(21,89)/10,n=R(21,89)/10,e1=R(3,7),e2=R(2,4);return[`Work out (${stm(m,e1)}) × (${stm(n,-e2)}). Give your answer in standard form.`,stf(m*n*10**(e1-e2))]},
()=>{let m=R(11,99)/10,n=R(11,99)/10;return[`Work out (${stm(m,5)}) + (${stm(n,4)}). Give your answer in standard form.`,stf(m*1e5+n*1e4)]}]),
mk('Upper and lower bounds','bound,error interval,accuracy',[
()=>{let u=P([1,10,100,0.1]),v=u*R(2,40);return[`A length is ${N(v)} cm, rounded to the nearest ${N(u)} cm. Write its lower and upper bounds.`,`${N(v-u/2)} cm ≤ length < ${N(v+u/2)} cm`]},
()=>{let a=R(11,99)/10;return[`x = ${N(a)} correct to 1 decimal place. Write the error interval for x.`,`${N(a-.05)} ≤ x < ${N(a+.05)}`]},
()=>{let l=R(5,15),w=R(4,10);return[`A rectangle is ${l} cm by ${w} cm, each measurement to the nearest cm. Find the upper bound of its perimeter.`,N(2*(l+w+1))+' cm']},
()=>{let l=R(5,15),w=R(4,10);return[`A rectangle is ${l} cm by ${w} cm, each measurement to the nearest cm. Find the lower bound of its area.`,N((l-.5)*(w-.5))+' cm²']}],[
()=>{let a=R(31,99)/10,b=R(21,89)/10;return[`a = ${N(a)} and b = ${N(b)}, both to 1 d.p. Work out the upper bound of a × b.`,N((a+.05)*(b+.05))]},
()=>{let a=R(31,99)/10,b=R(21,89)/10;return[`a = ${N(a)} and b = ${N(b)}, both to 1 d.p. Work out the lower bound of a ÷ b. Give 3 s.f.`,sfs((a-.05)/(b+.05),3)]},
()=>{let d=R(40,90),t=R(11,39)/10;return[`A car travels ${d} km (to the nearest km) in ${N(t)} hours (to the nearest 0.1 h). Find the upper bound of its average speed, to 3 s.f.`,sfs((d+.5)/(t-.05),3)+' km/h']}]),
mk('Index laws','index,indices,power',[
()=>{let a=R(2,8),b=R(2,8);return[`Simplify ${sup('x',a)} × ${sup('x',b)}`,sup('x',a+b)]},
()=>{let b=R(2,6),a=b+R(2,6);return[`Simplify ${sup('y',a)} ÷ ${sup('y',b)}`,sup('y',a-b)]},
()=>{let a=R(2,5),b=R(2,4);return[`Simplify (${sup('m',a)})<sup>${b}</sup>`,sup('m',a*b)]},
()=>{let a=R(2,6),b=R(2,5),c=R(2,3),d=R(2,4);return[`Simplify ${a}${sup('a',c)} × ${b}${sup('a',d)}`,`${a*b}${sup('a',c+d)}`]},
()=>{let b=P([2,3,4,5]),k=R(2,3);return[`Work out ${b}<sup>−${k}</sup>`,frac(1,b**k)]},
()=>{let a=R(2,5),b=R(2,4);return[`Simplify (${a}${sup('x',b)})<sup>2</sup>`,`${a*a}${sup('x',2*b)}`]},
()=>[`Work out ${P([3,5,7,12])}<sup>0</sup>`,1]],[
()=>{let b=R(2,9),k=R(3,6);return[`Work out ${b}<sup>${k}</sup>`,N(b**k)]},
()=>{let x=R(11,29)/10,k=R(3,4);return[`Work out ${N(x)}<sup>${k}</sup>`,N(x**k)]},
()=>{let b=R(2,9),a=R(6,9),c=R(2,4);return[`Work out ${b}<sup>${a}</sup> ÷ ${b}<sup>${c}</sup>`,N(b**(a-c))]}]),
mk('Prime factors, HCF and LCM','prime,hcf,lcm,factor,multiple',[
()=>{let n=P([36,48,60,72,84,90,96,120,126,140,150,180,196,210]);return[`Write ${n} as a product of its prime factors.`,pf(n)]},
()=>{let g=P([2,3,4,5,6]),m=P([[2,3],[3,4],[2,5],[3,5],[4,5],[5,6],[3,7]]);return[`Find the HCF and LCM of ${g*m[0]} and ${g*m[1]}.`,`HCF = ${g}, LCM = ${g*m[0]*m[1]}`]},
()=>{let[a,b]=P([[6,8],[10,15],[12,18],[9,12],[8,12],[15,20]]);return[`Two buses leave a station together. One leaves every ${a} minutes and the other every ${b} minutes. After how many minutes do they next leave together?`,lcm(a,b)+' minutes']},
()=>{let n=P([51,57,87,91,111,119,133,143,161,53,59,61,67,71,73,79,83,89,97]);let f=pf(n);return[`Is ${n} a prime number? Give a reason.`,f.includes('×')?`No: ${n} = ${f}`:'Yes: its only factors are 1 and itself']}],[
()=>{let n=P([756,924,1050,1260,1386,1470,1800,2310]);return[`Write ${N(n)} as a product of its prime factors.`,pf(n)]},
()=>{let g=P([6,12,14,15,18]),m=P([[5,7],[7,8],[5,9],[7,11],[8,9]]);return[`Find the HCF and LCM of ${g*m[0]} and ${g*m[1]}.`,`HCF = ${g}, LCM = ${N(g*m[0]*m[1])}`]}]),
mk('Fractions, decimals and percentages','fraction,decimal,percent,fdp',[
()=>{let[n,d]=P([[3,8],[5,8],[7,20],[9,40],[11,25],[13,50],[7,16]]);return[`Write ${frac(n,d)} as a decimal and as a percentage.`,`${N(n/d)} = ${N(n/d*100)}%`]},
()=>{let q=P([35,45,12,64,28,52,15,84,24,68]),g=gcd(q,100);return[`Write ${q}% as a fraction in its simplest form.`,frac(q/g,100/g)]},
()=>{let[n,d]=P([[45,100],[8,100],[125,1000],[65,100],[875,1000],[36,100],[4,100],[35,100],[375,1000]]),g=gcd(n,d);return[`Write ${n/d} as a fraction in its simplest form.`,frac(n/g,d/g)]},
()=>{let[a,b]=P([[3,5],[5,8],[7,10],[11,20],[17,25]]),fv=a/b,x=fv+P([.03,-.03]),y=fv+P([.015,-.015]);let it=[[frac(a,b),fv],[N(x),x],[N(y*100)+'%',y]];return[`Put these in order, smallest first: ${it.map(i=>i[0]).join(', ')}`,[...it].sort((u,v)=>u[1]-v[1]).map(i=>i[0]).join(' < ')]}],[
()=>{let b=P([40,45,48,60,65,75]),a=R(11,b-5);return[`Write ${a} out of ${b} as a percentage. Give your answer to 1 d.p.`,(a/b*100).toFixed(1)+'%']},
()=>{let d=P([7,9,11,13]),n=R(1,d-1);return[`Write ${frac(n,d)} as a decimal to 3 d.p.`,(n/d).toFixed(3)]}]),
mk('Ratio','ratio,share,equivalent',[
